name: تحديث بيانات الموقع

on:
  schedule:
    - cron: "17,47 * * * *"  # كل 30 دقيقة (الدقيقة 17 والدقيقة 47 من كل ساعة)
  workflow_dispatch:          # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: جلب البيانات من API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-data.js
      - name: حفظ البيانات الجديدة
        run: |
          git config user.name "mnbralhilal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "تحديث البيانات"
          git push
