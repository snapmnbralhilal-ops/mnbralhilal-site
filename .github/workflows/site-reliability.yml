name: Site reliability checks

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/play.js
          node --check assets/fixture.js
          node --check workers/live/worker.js
      - name: Validate data configuration
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const live = JSON.parse(readFileSync('data/live.json', 'utf8'));
          assert.match(live.url, /^https:\/\/[^\s]+\/live$/);
          const site = JSON.parse(readFileSync('data/site.json', 'utf8'));
          assert.equal(typeof site, 'object');
          console.log('Configuration JSON is valid');
          NODE
      - name: Check live-result safety guards
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const app = readFileSync('assets/app.js', 'utf8');
          const play = readFileSync('assets/play.js', 'utf8');
          assert.ok(!app.includes('now >= kickMs + 100 * 60e3'), 'Do not infer FT from elapsed time');
          assert.ok(play.includes('if (latest) GAME = latest'), 'Preserve game state on API failure');
          assert.ok(app.includes('LIVE_MATCH_VERSIONS'), 'Reject out-of-order score updates');
          assert.ok(app.includes('fixture.html?id='), 'Match details must be linked');
          const worker = readFileSync('workers/live/worker.js', 'utf8');
          assert.ok(worker.includes('url.pathname === "/fixture"'), 'Match center endpoint must exist');
          assert.ok(worker.includes('fixtures/lineups'), 'Lineups must be requested');
          assert.ok(!worker.includes('status: "FT", elapsed: null'), 'Never fabricate FT on timeout');
          assert.ok(worker.includes('if (!res.ok) throw new Error("API-Football HTTP "'), 'Reject upstream HTTP failures');
          assert.ok(worker.includes('Invalid fixtures response'), 'Reject malformed upstream data');
          assert.ok(worker.includes('stale: LIVE.includes(overlay.status)'), 'Expose freshness on live match details');
          const fixture = readFileSync('assets/fixture.js', 'utf8');
          assert.ok(fixture.includes('تحديث المباراة متأخر'), 'Warn when live data is stale');
          console.log('Regression guards passed');
          NODE
