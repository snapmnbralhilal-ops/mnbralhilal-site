name: رفع التحديث المباشر (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["workers/live/**", ".github/workflows/deploy-live.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: التأكد من وجود مفاتيح Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID في إعدادات المستودع (Secrets) ثم شغّل هذا مرة ثانية"; exit 1; fi

      - name: مساحة التخزين (KV) — تنسوى أول مرة لحالها
        working-directory: workers/live
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API?per_page=100" | jq -r '.result[]? | select(.title=="mnbr-live") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"mnbr-live"}' "$API" | jq -r '.result.id')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then echo "::error::ما قدرت أسوي مساحة KV — تأكد إن المفتاح من قالب Edit Cloudflare Workers"; exit 1; fi
          sed -i "s/__KV_ID__/$ID/" wrangler.toml

      - name: رفع العامل
        working-directory: workers/live
        run: npx --yes wrangler@3 deploy

      - name: مفتاح API-Football للعامل
        working-directory: workers/live
        run: echo "$API_FOOTBALL_KEY" | npx --yes wrangler@3 secret put API_FOOTBALL_KEY

      - name: حفظ رابط العامل للموقع
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then echo "::error::حساب Cloudflare ما عنده اسم workers.dev — افتح Workers & Pages مرة وحدة من لوحة Cloudflare"; exit 1; fi
          echo "{ \"url\": \"https://mnbr-live.$SUB.workers.dev/live\" }" > data/live.json
          cat data/live.json
          git config user.name "mnbralhilal-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || (git commit -m "رابط التحديث المباشر" && git pull --rebase && git push)
