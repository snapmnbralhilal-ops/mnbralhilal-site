name: رفع التحديث المباشر (Cloudflare)

on:
  push:
    branches: [main]
    paths: ["workers/live/**", ".github/workflows/deploy-live.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9500d0ffd063be8bb000048d1c6c2c75' }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ADMIN_GH_TOKEN: ${{ secrets.ADMIN_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: التأكد من وجود مفاتيح Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID في إعدادات المستودع (Secrets) ثم شغّل هذا مرة ثانية"; exit 1; fi

      - name: فحص المفتاح والحساب
        run: |
          V=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "::notice::token verify: $(echo "$V" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          A=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          echo "::notice::accounts visible to token: $(echo "$A" | jq -c '[.result[]? | {id, name}]') errors: $(echo "$A" | jq -c '[.errors[]?.message]')"

      - name: مساحة التخزين (KV) — تنسوى أول مرة لحالها
        working-directory: workers/live
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          L=$(curl -s -H "$AUTH" "$API?per_page=100")
          echo "::notice::kv list: $(echo "$L" | jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"]}')"
          ID=$(echo "$L" | jq -r '.result[]? | select(.title=="mnbr-live") | .id' | head -1)
          if [ -z "$ID" ]; then
            C=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"mnbr-live"}' "$API")
            echo "::notice::kv create: $(echo "$C" | jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"]}')"
            ID=$(echo "$C" | jq -r '.result.id // empty')
          fi
          if [ -z "$ID" ]; then echo "::error::ما قدرت أسوي مساحة KV — شوف الملاحظات فوق"; exit 1; fi
          sed -i "s/__KV_ID__/$ID/" wrangler.toml

      - name: رفع العامل
        working-directory: workers/live
        run: npx --yes wrangler@3 deploy

      - name: مفتاح API-Football للعامل
        working-directory: workers/live
        run: echo "$API_FOOTBALL_KEY" | npx --yes wrangler@3 secret put API_FOOTBALL_KEY

      - name: مفتاح GitHub للوحة التحكم (اختياري)
        if: env.ADMIN_GH_TOKEN != ''
        working-directory: workers/live
        run: echo "$ADMIN_GH_TOKEN" | npx --yes wrangler@3 secret put GH_TOKEN

      - name: حفظ رابط العامل للموقع
        continue-on-error: true
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          SUB=${SUB:-snapmnbralhilal}
          echo "{ \"url\": \"https://mnbr-live.$SUB.workers.dev/live\" }" > data/live.json
          cat data/live.json
          git config user.name "mnbralhilal-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet && exit 0
          git commit -m "رابط التحديث المباشر"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done

      - name: فحص العامل بعد الرفع
        continue-on-error: true
        run: |
          sleep 10
          H=$(curl -s "https://mnbr-live.snapmnbralhilal.workers.dev/health?refresh=1")
          echo "::notice::health: $H"
          echo "::notice::push: $(curl -s https://mnbr-live.snapmnbralhilal.workers.dev/push/key | head -c 60)"
          echo "::notice::league: $(curl -s https://mnbr-live.snapmnbralhilal.workers.dev/league | head -c 120)"
          echo "::notice::game: $(curl -s https://mnbr-live.snapmnbralhilal.workers.dev/game | head -c 200)"
