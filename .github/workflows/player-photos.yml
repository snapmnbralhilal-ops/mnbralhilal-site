name: جلب صور اللاعبين من موقع الهلال

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/player-photos.json]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: تحميل الصور الأصلية
        run: |
          mkdir -p /tmp/src
          python3 - <<'PY'
          import json, urllib.request, time
          m = json.load(open("scripts/player-photos.json"))
          for k, path in m.items():
              url = "https://images.ctfassets.net/eyc25wndlima/" + path + "?fm=png&w=800"
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      data = urllib.request.urlopen(req, timeout=60).read()
                      open(f"/tmp/src/{k}.png", "wb").write(data); print(k, len(data)); break
                  except Exception as e:
                      print("retry", k, e); time.sleep(2)
          PY
      - name: رفعها على فرع player-src
        run: |
          cd /tmp/src
          git init -q -b player-src
          git config user.name "mnbralhilal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "صور اللاعبين الأصلية"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" player-src
