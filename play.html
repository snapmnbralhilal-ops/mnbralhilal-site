<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mnbr-theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العب مع منبر — توقّع، صوّت، كن أنت المدرب</title>
<meta name="description" content="توقّع نتيجة مباراة الهلال، صوّت لرجل المباراة، واختر تشكيلتك وشاركها — من منبر الهلال.">
<meta name="theme-color" content="#E4E6EA">
<meta property="og:title" content="🎯 توقّع نتيجة الهلال مع منبر">
<meta property="og:description" content="توقّع النتيجة، صوّت لرجل المباراة، وكن أنت المدرب.">
<meta property="og:image" content="https://mnbralhilal.net/assets/icon-512.png">
<meta property="og:url" content="https://mnbralhilal.net/play.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="منبر الهلال">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://mnbralhilal.net/play.html">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
<link rel="preload" href="assets/fonts/ExpoArabic-Book.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/ExpoArabic-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=202610090640">
<link rel="stylesheet" href="assets/theme-night.css?v=202610090640">
<link rel="stylesheet" href="assets/theme-light.css?v=202610090640">
<link rel="stylesheet" href="assets/play.css?v=202610081830">
</head>
<body data-page="play">
<script src="assets/layout.js?v=202610090640"></script>

<main id="main" class="page page-play">
<h1 class="sr-only">العب مع منبر</h1>

<div class="wrap narrow play">

  <section class="pl-hero" id="plMatch">
    <div class="empty">جاري التحميل…</div>
  </section>

  <nav class="pl-tabs" role="tablist" aria-label="الألعاب">
    <button role="tab" aria-selected="true" data-t="predict">🎯 توقّع النتيجة</button>
    <button role="tab" aria-selected="false" data-t="vote">⭐ رجل المباراة</button>
    <button role="tab" aria-selected="false" data-t="coach">📋 كن أنت المدرب</button>
    <button role="tab" aria-selected="false" data-t="league">🏆 الدوري</button>
  </nav>

  <button type="button" class="push-btn" data-push hidden>🔔 فعّل تنبيهات المباريات والأهداف</button>

  <!-- توقّع النتيجة -->
  <section class="box pl-sec" id="t-predict">
    <div id="pForm"></div>
    <div id="pStats"></div>
  </section>

  <!-- رجل المباراة -->
  <section class="box pl-sec" id="t-vote" hidden>
    <div id="vBody"></div>
  </section>

  <!-- كن أنت المدرب -->
  <section class="box pl-sec" id="t-coach" hidden>
    <div class="co-head">
      <div><b>كن أنت المدرب</b><small>اختر الخطة، واضغط على أي مركز وحط لاعبك</small></div>
    </div>
    <div class="co-forms" id="coForms"></div>
    <div class="pitch" id="pitch" aria-label="الملعب"></div>
    <div class="co-actions">
      <button type="button" class="card-btn" id="coShare">📤 حمّل وشارك تشكيلتي</button>
      <button type="button" class="lb-btn" id="coAuto">⚡ تشكيلة سريعة</button>
      <button type="button" class="lb-btn" id="coClear">مسح</button>
    </div>
    <div id="coSend"></div>
    <div id="coCrowd"></div>
  </section>

  <!-- دوري التوقعات -->
  <section class="box pl-sec" id="t-league" hidden>
    <div id="lgBody"><p class="pl-muted center">جاري التحميل…</p></div>
  </section>

  <p class="pl-note">توقّع واحد لكل جهاز، وتقدر تعدّله لين بداية المباراة. التصويت لرجل المباراة يفتح بعد صافرة النهاية. نقاط الدوري تنحسب تلقائياً بعد كل مباراة.</p>
</div>

<dialog id="picker" class="sheet" aria-label="اختر لاعب">
  <div class="sheet-in">
    <div class="sheet-top"><b id="pkTitle">اختر لاعب</b><button type="button" id="pkClose" aria-label="إغلاق">✕</button></div>
    <div class="pk-tabs" id="pkTabs"></div>
    <div class="pk-list" id="pkList"></div>
  </div>
</dialog>

</main>

<script>LAYOUT.foot()</script>
<script src="assets/play.js?v=202610081830"></script>
<script src="assets/social.js?v=202610081830"></script>
<script src="assets/push.js?v=202610090600"></script>
</body>
</html>
