<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png?v=2">

<body data-page="matches">
<script src="assets/layout.js?v=202610091935"></script>

<div class="strip" id="stripWrap" hidden aria-label="مباريات اليوم">
  <div class="wrap"><div class="strip-row" id="strip"></div></div>
</div>

<main id="main" class="page page-matches">
<h1 class="sr-only">المباريات</h1>

<div class="wrap month-wrap"><section class="box" id="month" hidden>
  <h2><span class="ic"><svg class="i"><use href="#i-cal"/></svg></span><span id="monthTitle">مباريات الشهر</span></h2>
  <div class="mo-legend"><span data-k="l"><i class="lg-l"></i>الدوري</span><span data-k="c"><i class="lg-c"></i>آسيا</span><span data-k="o"><i class="lg-o"></i>الكؤوس</span><span><svg class="i"><use href="#i-home"/></svg>على أرضه</span><span><svg class="i"><use href="#i-plane"/></svg>خارج أرضه</span></div>
  <div class="mo-cal" id="monthCal"></div>
  <div class="mo-list" id="monthList"></div>
</section></div>
<div class="wrap grid">
  <div class="col">
    <section class="box" id="hilal">
      <h2><span class="ic"><svg class="i"><use href="#i-cal"/></svg></span>مباريات الهلال</h2>
      <div class="form"><span>آخر 5 مباريات</span><span id="formStrip" style="display:flex;gap:6px"></span></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabUp" aria-selected="true">القادمة</button>
        <button role="tab" id="tabRes" aria-selected="false">النتائج</button>
      </div>
      <div id="hilalList"></div>
    </section>

    <section class="box" id="today">
      <h2><span class="ic"><svg class="i"><use href="#i-globe"/></svg></span>مباريات اليوم حول العالم <span class="note" id="todayDate"></span></h2>
      <div id="todayList"></div>
    </section>
  </div>

  <div class="col">
    <div class="ad-slot" data-slot="sidebar" hidden></div>
    <section class="box" id="yesterday">
      <h2><span class="ic"><svg class="i"><use href="#i-history"/></svg></span>نتائج أمس</h2>
      <div id="ydayList"></div>
    </section>
    <div class="ad-slot" data-slot="between" hidden></div>
  </div>
</div>

</main>

<script>LAYOUT.foot()</script>
<script src="assets/names.js?v=202610081830"></script>
