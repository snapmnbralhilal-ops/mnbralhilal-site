<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المباريات — منبر الهلال</title>
<meta name="description" content="مباريات الهلال القادمة ونتائجه، ومباريات اليوم حول العالم ونتائج أمس.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
<link rel="preload" href="assets/fonts/ExpoArabic-Book.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="assets/fonts/ExpoArabic-Bold.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=202610080700">
</head>
<body data-page="matches">
<script src="assets/layout.js?v=202610080700"></script>

<div class="strip" id="stripWrap" hidden aria-label="مباريات اليوم">
  <div class="wrap"><div class="strip-row" id="strip"></div></div>
</div>

<main id="main" class="page page-matches">
<h1 class="sr-only">المباريات</h1>

<div class="wrap grid">
  <div class="col">
    <section class="box" id="hilal">
      <h2><span class="ic"><svg class="i"><use href="#i-cal"/></svg></span>مباريات الهلال</h2>
      <div class="form"><span>آخر 5 مباريات</span><span id="formStrip" style="display:flex;gap:6px"></span></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tabUp" aria-selected="true">القادمة</button>
        <button role="tab" id="tabRes" aria-selected="false">النتائج</button>
      </div>
      <div id="hilalList"></div>
    </section>

    <section class="box" id="today">
      <h2><span class="ic"><svg class="i"><use href="#i-globe"/></svg></span>مباريات اليوم حول العالم <span class="note" id="todayDate"></span></h2>
      <div id="todayList"></div>
    </section>
  </div>

  <div class="col">
    <div class="ad-slot" data-slot="sidebar" hidden></div>
    <section class="box" id="yesterday">
      <h2><span class="ic"><svg class="i"><use href="#i-history"/></svg></span>نتائج أمس</h2>
      <div id="ydayList"></div>
    </section>
    <div class="ad-slot" data-slot="between" hidden></div>
  </div>
</div>

</main>

<script>LAYOUT.foot()</script>
<script src="assets/names.js?v=202610080700"></script>
<script src="assets/app.js?v=202610080700"></script>
<script src="assets/social.js?v=202610080700"></script>
</body>
</html>
