# عامل التحديث المباشر لمنبر الهلال — يرفعه GitHub تلقائياً (.github/workflows/deploy-live.yml)
name = "mnbr-live"
account_id = "9500d0ffd063be8bb000048d1c6c2c75"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]   # كل دقيقة يشيك: فيه مباراة للهلال الحين؟

[vars]
SITE = "https://snapmnbralhilal-ops.github.io/mnbralhilal-site"
# كل كم ثانية يسحب النتيجة وقت مباراة الهلال.
# الخطة المجانية (100 طلب باليوم): 180  — باقة Pro: 15
LIVE_INTERVAL = "15"
# لوحة التحكم: بصمة كلمة المرور (SHA-256) — مو كلمة المرور نفسها
ADMIN_HASH = "3c1483ed250569b057268440ef593c2f08ebafff09dc6cadae5c1d76b5804bc9"

[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

# ألعاب الجمهور (توقعات + رجل المباراة) — مخزن لكل مباراة
[[durable_objects.bindings]]
name = "GAME"
class_name = "Game"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Game"]

# دوري التوقعات + تنبيهات الجوال
[[durable_objects.bindings]]
name = "LEAGUE"
class_name = "League"

[[durable_objects.bindings]]
name = "PUSH"
class_name = "Push"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["League", "Push"]
