<body data-page="videos">
<script src="assets/layout.js?v=202610080720"></script>


<main id="main" class="vpage page">
  <div class="wrap">
    <h1 class="sr-only">فيديو منبر</h1>

    <div class="tabs" role="tablist" id="vTabs">
      <button role="tab" aria-selected="true" data-tab="mnbr">إنتاج منبر</button>
      <button role="tab" aria-selected="false" data-tab="clips">لقطات المباريات</button>
    </div>

    <section id="tab-mnbr">
      <div id="vFeatured" class="v-grid"></div>
      <div class="box v-profile" id="vProfileBox" hidden>
        <h2>آخر فيديوهات منبر على تيك توك <a class="note" id="vFollow" target="_blank" rel="noopener">تابعنا</a></h2>
        <div id="vProfile"></div>
        <a class="v-open" id="vOpen" target="_blank" rel="noopener">
          <span><b>شاهد كل فيديوهات منبر على تيك توك</b><small id="vOpenUser"></small></span>
          <span class="v-open-btn">افتح تيك توك</span>
        </a>
      </div>
      <div class="empty box" id="vEmpty" hidden>قريباً — فيديوهات منبر</div>
    </section>

    <section id="tab-clips" hidden>
      <div id="vClips" class="v-grid"></div>
      <div class="empty box" id="vClipsEmpty" hidden>لا توجد لقطات حالياً</div>
      <p class="v-note">اللقطات معروضة من الحسابات الرسمية على تيك توك، وحقوقها لأصحابها.</p>
    </section>
  </div>
</main>
